<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css">
    <title>Image Carousel</title>
    <script defer src="slideshow.js"></script>
  </head>
  <body>
    <div id="carousel">
      <img id="carousel-img" src="./assets/cute-cat-a.png" alt="cat-pic" />
    </div>
    <div id="allbtns">
      <div id="backwardbtn"><button type="button" id="backward-btn">Backward</button></div>
      <div id="forwardbtn"><button type="button" id="forward-btn">Forward</button></div>
      <div id="autoforwardbtn"><button type="button" id="auto-forward-btn">Auto Forward</button></div>
      <div id="autobackwardbtn"><button type="button" id="auto-backward-btn">Auto Backward</button></div>
      <div id="stopbtn"><button type="button" id="stop-btn">Stop</button>
    </div>
  </body>
</html>
